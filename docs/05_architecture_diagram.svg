<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Montserrat, 'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif">
  <!-- 발표 덱(슬라이드 초안.pdf)의 시각 언어에 맞춤: 밝은 회색 배경 · 회색 라운드 박스 ·
       파란색(#2E5BFF) 강조 · 검은 직각 화살표.  슬라이드 "How It Works" 교체용.
       기존 덱 다이어그램과의 차이 = My School(장학금) 게이트가 라우터 앞에 추가됨. -->
  <rect width="1280" height="720" fill="#F2F3F5"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="70" y="96" font-size="46" font-weight="800" fill="#111111">How It Works</text>
  <circle cx="392" cy="80" r="13" fill="#2E5BFF"/>

  <!-- ============ ROW 1: two curated answers ============ -->
  <g>
    <rect x="326" y="150" width="270" height="78" rx="14" fill="#C9CACC"/>
    <text x="461" y="184" font-size="18" font-weight="800" fill="#111111" text-anchor="middle">Your school's scholarships</text>
    <text x="461" y="208" font-size="14" fill="#333333" text-anchor="middle">matched to degree · TOPIK</text>
  </g>
  <g>
    <rect x="626" y="150" width="270" height="78" rx="14" fill="#C9CACC"/>
    <text x="761" y="184" font-size="18" font-weight="800" fill="#111111" text-anchor="middle">Senior-student tip</text>
    <text x="761" y="208" font-size="14" fill="#333333" text-anchor="middle">warns + legal path</text>
  </g>
  <text x="611" y="262" font-size="13.5" fill="#8A8F98" text-anchor="middle">hand-curated by us · no generation</text>

  <!-- ============ ROW 2: question → gates → router ============ -->
  <g>
    <rect x="40" y="392" width="222" height="82" rx="14" fill="#C9CACC"/>
    <text x="151" y="426" font-size="19" font-weight="800" fill="#111111" text-anchor="middle">User Question</text>
    <text x="151" y="450" font-size="14" fill="#333333" text-anchor="middle">in English + my profile</text>
  </g>
  <path d="M 262 433 H 316" stroke="#111111" stroke-width="2.5" marker-end="url(#ar)"/>

  <g>
    <rect x="322" y="392" width="212" height="82" rx="14" fill="#C9CACC"/>
    <text x="428" y="424" font-size="18" font-weight="800" fill="#111111" text-anchor="middle">1. My School?</text>
    <text x="428" y="448" font-size="13.5" fill="#333333" text-anchor="middle">scholarships · per-school data</text>
  </g>
  <path d="M 428 392 V 234" stroke="#111111" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="444" y="330" font-size="15" font-weight="700" fill="#111111">Yes</text>
  <path d="M 534 433 H 588" stroke="#111111" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="546" y="422" font-size="15" font-weight="700" fill="#111111">No</text>

  <g>
    <rect x="594" y="392" width="212" height="82" rx="14" fill="#C9CACC"/>
    <text x="700" y="424" font-size="18" font-weight="800" fill="#111111" text-anchor="middle">2. Sunbae Lounge?</text>
    <text x="700" y="448" font-size="13.5" fill="#333333" text-anchor="middle">campus life · gray-zone</text>
  </g>
  <path d="M 728 392 V 234" stroke="#111111" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="744" y="330" font-size="15" font-weight="700" fill="#111111">Yes</text>
  <path d="M 806 433 H 856" stroke="#111111" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="818" y="422" font-size="15" font-weight="700" fill="#111111">No</text>

  <g>
    <rect x="862" y="386" width="212" height="94" rx="14" fill="#2E5BFF"/>
    <text x="968" y="418" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">3. Router</text>
    <text x="968" y="441" font-size="13.5" fill="#DCE4FF" text-anchor="middle">LLM + keyword fallback</text>
    <text x="968" y="461" font-size="13.5" fill="#DCE4FF" text-anchor="middle">number or rule?</text>
  </g>

  <!-- ============ RIGHT COLUMN: four routes ============ -->
  <g>
    <rect x="1108" y="120" width="140" height="62" rx="12" fill="#C9CACC"/>
    <text x="1178" y="148" font-size="15.5" font-weight="800" fill="#111111" text-anchor="middle">SQL</text>
    <text x="1178" y="168" font-size="12" fill="#333333" text-anchor="middle">table + chart</text>
  </g>
  <g>
    <rect x="1108" y="200" width="140" height="76" rx="12" fill="#C9CACC"/>
    <text x="1178" y="226" font-size="15.5" font-weight="800" fill="#111111" text-anchor="middle">Rules (RAG)</text>
    <text x="1178" y="246" font-size="12" fill="#333333" text-anchor="middle">cited + as-of date</text>
    <text x="1178" y="263" font-size="12" fill="#333333" text-anchor="middle">EN → KO bridge</text>
  </g>
  <g>
    <rect x="1108" y="294" width="140" height="62" rx="12" fill="#C9CACC"/>
    <text x="1178" y="322" font-size="15.5" font-weight="800" fill="#111111" text-anchor="middle">Both (hybrid)</text>
    <text x="1178" y="342" font-size="12" fill="#333333" text-anchor="middle">stats + rules</text>
  </g>
  <g>
    <rect x="1108" y="374" width="140" height="76" rx="12" fill="#C9CACC"/>
    <text x="1178" y="400" font-size="15.5" font-weight="800" fill="#111111" text-anchor="middle">Refuse</text>
    <text x="1178" y="420" font-size="12" fill="#333333" text-anchor="middle">below 0.42 →</text>
    <text x="1178" y="437" font-size="12" fill="#333333" text-anchor="middle">“I don't know” + ☎1345</text>
  </g>

  <!-- router → routes -->
  <path d="M 1074 433 H 1090 V 151 H 1104" stroke="#111111" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1090 238 H 1104" stroke="#111111" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M 1090 325 H 1104" stroke="#111111" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M 1090 412 H 1104" stroke="#111111" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- ============ CONTRACT BAR ============ -->
  <path d="M 326 189 H 268 V 556 H 300" stroke="#111111" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 761 150 V 104 H 1268 V 556 H 1214" stroke="#111111" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1248 151 H 1268" stroke="#111111" stroke-width="2.5" fill="none"/>
  <path d="M 1248 238 H 1268" stroke="#111111" stroke-width="2.5" fill="none"/>
  <path d="M 1248 325 H 1268" stroke="#111111" stroke-width="2.5" fill="none"/>
  <path d="M 1248 412 H 1268" stroke="#111111" stroke-width="2.5" fill="none"/>

  <rect x="304" y="514" width="906" height="84" rx="16" fill="#2E5BFF"/>
  <text x="757" y="550" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">One contract for every path</text>
  <text x="757" y="578" font-size="15.5" fill="#DCE4FF" text-anchor="middle">a cited government source, its as-of date, and the branch that applies to you — or it explicitly says it can't.</text>

  <text x="640" y="650" font-size="14" fill="#8A8F98" text-anchor="middle">Two curated layers answer what public data does not hold. Everything else is routed. Nothing is guessed.</text>
</svg>
