  <text x="240" y="400" font-size="20" font-weight="700" fill="#2E5BFF">3</text>
  <text x="272" y="400" font-size="21" font-weight="700" fill="#111111">법무부 자격별 안내 매뉴얼 (2026.07.09)</text>
