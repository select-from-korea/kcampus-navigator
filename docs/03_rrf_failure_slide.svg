<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="58" font-size="34" font-weight="800" fill="#111827">Why we dropped RRF — a failure we can show</text>
  <text x="40" y="92" font-size="18" fill="#6B7280">Same query on our corpus: <tspan font-weight="700" fill="#374151">“How do I extend my student visa?”</tspan> — three fusion methods, three different Top-1 documents.</text>

  <!-- Three cards -->
  <!-- Card 1: Dense -->
  <g>
    <rect x="40" y="130" width="378" height="196" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="40" y="130" width="378" height="44" rx="12" fill="#EFF4FF"/>
    <rect x="40" y="158" width="378" height="16" fill="#EFF4FF"/>
    <text x="62" y="159" font-size="17" font-weight="800" fill="#1D4ED8">Dense (vector) Top-1</text>
    <text x="62" y="210" font-size="19" font-weight="700" fill="#111827">출입국관리법 시행령</text>
    <text x="62" y="234" font-size="14" fill="#6B7280">(Enforcement Decree — a distractor)</text>
    <text x="62" y="280" font-size="15" fill="#374151">score <tspan font-weight="700">0.535</tspan></text>
    <text x="360" y="308" font-size="22" font-weight="800" fill="#DC2626" text-anchor="end">✗ wrong</text>
  </g>

  <!-- Card 2: BM25 -->
  <g>
    <rect x="451" y="130" width="378" height="196" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="451" y="130" width="378" height="44" rx="12" fill="#ECFDF5"/>
    <rect x="451" y="158" width="378" height="16" fill="#ECFDF5"/>
    <text x="473" y="159" font-size="17" font-weight="800" fill="#047857">BM25 (keyword) Top-1</text>
    <text x="473" y="210" font-size="19" font-weight="700" fill="#111827">체류기간 연장 안내</text>
    <text x="473" y="234" font-size="14" fill="#6B7280">(the actual visa-extension guide)</text>
    <text x="473" y="280" font-size="15" fill="#374151">exact term match: <tspan font-weight="700">“연장”</tspan></text>
    <text x="807" y="308" font-size="22" font-weight="800" fill="#047857" text-anchor="end">✓ right</text>
  </g>

  <!-- Card 3: RRF -->
  <g>
    <rect x="862" y="130" width="378" height="196" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="862" y="130" width="378" height="44" rx="12" fill="#FEF3C7"/>
    <rect x="862" y="158" width="378" height="16" fill="#FEF3C7"/>
    <text x="884" y="159" font-size="17" font-weight="800" fill="#B45309">RRF (rank fusion) Top-1</text>
    <text x="884" y="210" font-size="19" font-weight="700" fill="#111827">유학생 건강보험 안내</text>
    <text x="884" y="234" font-size="14" fill="#6B7280">(health insurance — a THIRD doc!)</text>
    <text x="884" y="280" font-size="15" fill="#374151">2nd in Dense <tspan font-weight="700">&amp;</tspan> 2nd in BM25</text>
    <text x="1218" y="308" font-size="22" font-weight="800" fill="#B45309" text-anchor="end">✗ worse</text>
  </g>

  <!-- Diagnosis band -->
  <rect x="40" y="358" width="1200" height="96" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="64" y="392" font-size="18" font-weight="800" fill="#111827">Root cause — RRF keeps <tspan fill="#B45309">ranks</tspan> and throws away <tspan fill="#1D4ED8">score magnitude.</tspan></text>
  <text x="64" y="420" font-size="16" fill="#374151">Dense and BM25 disagreed on #1, so they split the vote — and a document that was a steady #2 in both won the sum.</text>
  <text x="64" y="444" font-size="16" fill="#374151">RRF is built for huge corpora with incompatible score scales. With a few dozen documents, discarding magnitude is fatal.</text>

  <!-- Fix band -->
  <rect x="40" y="470" width="1200" height="150" rx="12" fill="#0F172A"/>
  <text x="64" y="506" font-size="18" font-weight="800" fill="#FFFFFF">Our fix — score fusion (per-query min-max, then weighted sum)</text>
  <text x="64" y="542" font-size="16" font-family="'SF Mono', ui-monospace, Menlo, monospace" fill="#93C5FD">dense_norm = (dense − min) / (max − min)</text>
  <text x="64" y="566" font-size="16" font-family="'SF Mono', ui-monospace, Menlo, monospace" fill="#93C5FD">fused = w_dense · dense_norm + w_bm25 · bm25_norm</text>
  <text x="64" y="600" font-size="16" fill="#E2E8F0">The <tspan font-weight="700" fill="#FFFFFF">1st-to-2nd gap is preserved</tspan> → consensus bias gone. And it’s a <tspan font-weight="700" fill="#FFFFFF">config parameter</tspan> (FUSION=score|rrf), not a hard-coded guess.</text>

  <!-- Footer caveat (the honesty beat) -->
  <text x="40" y="668" font-size="15" fill="#6B7280">First measured on 5 documents — too few to conclude from. We re-ran on the 7/24 real corpus and the ranking changed. <tspan font-weight="700" fill="#374151">Small n, reported honestly.</tspan></text>
  <text x="40" y="700" font-size="13" fill="#9CA3AF">Source: src/retriever.py · SELECT * FROM Korea</text>
</svg>
