  <line x1="340" y1="524" x2="1060" y2="524" stroke="#E6E8EB" stroke-width="1.5"/>

  <text x="340" y="570" font-size="21" font-weight="600" fill="#111111">SQL answer accuracy <tspan font-size="15" font-weight="500" fill="#8A8F98">vs independent pandas oracle</tspan></text>
