  <text x="1060" y="424" font-size="27" font-weight="700" fill="#111111" text-anchor="end">13 / 16</text>
  <line x1="340" y1="450" x2="1060" y2="450" stroke="#E6E8EB" stroke-width="1.5"/>

  <text x="340" y="496" font-size="21" font-weight="600" fill="#111111">Abstention <tspan font-size="16" font-weight="500" fill="#8A8F98">@ 0.42</tspan></text>
