  <rect x="300" y="200" width="800" height="464" rx="18" fill="#FFFFFF"/>
  <path d="M 318 200 H 1082 A 18 18 0 0 1 1100 218 V 226 H 300 V 218 A 18 18 0 0 1 318 200 Z" fill="#2E5BFF"/>

  <text x="340" y="278" font-size="15" font-weight="600" fill="#8A8F98" letter-spacing="1.2">ALL SELF-MEASURED · 7/24 CORPUS · RAW FRACTIONS</text>
