<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Montserrat, 'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif">
  <!-- 발표 덱(슬라이드 초안2) 7번 "The Numbers" 교체용.
